<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>hossam elaskary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #333; }
        .welcome {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            white-space: nowrap;
            overflow: hidden;
            animation: marquee 5s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover { background-color: #0056b3; }
        .section { display: none; }
        .section.active { display: block; }
        #page2 {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            margin: -20px;
            padding: 20px;
        }
        #page2 h1 { font-size: 18px; color: yellow; }
        #page2 .btn { background-color: #1e1e1e; border: 1px solid #444; }
        #page2 .btn:hover { background-color: #333; }
        #page2 .btn-multi { background-color: #2a6e2a; }
        #page2 .btn-onln { background-color: #6b3fa0; }
        .footer-text { margin-top: 60px; color: #ccc; font-size: 16px; }
        .footer-text a { color: #f31414; margin: 0 10px; }
        #crypto { display: none; }
    </style>

    <script>
        // تسجيل Service Worker من خلال Blob، عشان الكل يبقى في ملف واحد
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'hossam-v1';
                const FILES = [location.href];
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(FILES)));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob))
                .catch(err => console.log('SW error:', err));
        }
    </script>
</head>
<body>

<div id="page1" class="section active">

        <button class="btn"

        <button class="btn btn-onln"
            onmouseover="setMsg('If you like my work you can support me with a donation.')"

        <div class="footer-text">
            <p>Designed by:
                <a href="https://www.tiktok.com/@hossam.elaskary?_r=1&_t=ZS-9B9ctiVsLwX"
                   target="_blank">https://www.tiktok.com/@hossam.elaskary</a>

            <p>A special thanks to all the devs on the scene.</p>
        </div>

        <br>
        <button class="btn" onclick="showPage('page1')">الرجوع للصفحة الرئيسية</button>
    </div>

    <div id="crypto">
        <br>
        <button class="btn" onclick="loadMenu()">Return</button>
    </div>
</div>

<script>
    const DEFAULT_MSG = 'PS4 Exploit Host by GamerHack';

    function showPage(pageId) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }
    function setMsg(text) {
        document.getElementById('msgs').textContent = text;
    }
    function donations() {
        document.getElementById('crypto').style.display = 'block';
        document.getElementById('menu').style.display = 'none';
        setMsg(DEFAULT_MSG);
    }
    function loadMenu() {
        document.getElementById('menu').style.display = 'block';
        document.getElementById('crypto').style.display = 'none';
    }
</script>

</body>
</html>
